baseURL = "https://go-quake2.github.io/"
title = "go-quake2"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Only the brand card today — engine work has not started; org is reserved.
[[params.repos]]
  name = "brand"
  accel = "Logos, favicons, social previews"
  kind = "brand"
  result = "Brand assets — SVG / PNG / JPG / ICO / ICNS in color, white-transparent and black-transparent variants. Staked out so the go-quake1 / 2 / 3 family is visually coherent the day the Q2 port starts."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.52:1, bright on the dark background 5.82:1.
  base = "#6e2a05"
  deep = "#431a03"
  bright = "#d9711a"
  shadow = "rgba(110,42,5,.7)"
  glow = "rgba(110,42,5,.6)"
  wash = "rgba(110,42,5,.10)"
  washDeep = "rgba(67,26,3,.06)"
  chipBg = "#faeee4"
  chipBorder = "#f4d4ba"
  chipFg = "#431a03"
  chipBgDark = "rgba(217,113,26,.14)"
  chipBorderDark = "rgba(217,113,26,.32)"
  chipFgDark = "#eab181"
  statsEnd = "#f6ddc8"
  bandText = "#f9e8da"
